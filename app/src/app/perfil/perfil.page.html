<ion-content>
  <header>
    <div class="avatar">{{ (sb.perfil()?.nombre_usuario || email() || '?').charAt(0).toUpperCase() }}</div>
    @if (editando()) {
      <form class="editar" (ngSubmit)="guardar()">
        <input name="username" aria-label="Nombre de usuario" [(ngModel)]="username" maxlength="30" />
        <button class="boton" type="submit">Guardar</button>
      </form>
    } @else {
      <h1>{{ sb.perfil()?.nombre_usuario || 'Sin nombre de usuario' }}</h1>
      <button class="enlace" type="button" (click)="editar()">Cambiar nombre de usuario</button>
    }
    <p class="texto-suave">{{ email() }}</p>
    @if (sb.esAdmin()) { <span class="chip ambar">Administrador</span> }
  </header>
  <div class="cuerpo">
    <div class="tarjeta fila">
      <span>Identificaciones disponibles hoy</span>
      <strong>{{ restantes() ?? '–' }} de {{ limite }}</strong>
    </div>
    <button class="boton secundario" type="button" (click)="salir()"><ion-icon name="log-out-outline" />Cerrar sesión</button>
  </div>
</ion-content>
